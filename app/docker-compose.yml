services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orquidea-viajera-web
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  # Servicio opcional para desarrollo con hot-reload.
  # Usar:  docker compose --profile dev up dev
  dev:
    image: node:20-alpine
    container_name: orquidea-viajera-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    profiles: ["dev"]
